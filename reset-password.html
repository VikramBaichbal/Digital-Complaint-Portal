<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Gram Panchayat Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Gram Panchayat Portal</h1>
            <p>Account Security & Password Recovery</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 450px; margin: 3rem auto;">
            <h2 style="color: var(--primary-dark); margin-bottom: 0.5rem; text-align: center;">Set New Password</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">
                Enter a strong new password (minimum 6 characters) for your account.
            </p>

            <div id="status-msg" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" minlength="6" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" minlength="6" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary" id="reset-btn" style="width: 100%;">Update Password</button>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-enhancements.js"></script>
    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('reset-btn');

            if (newPassword !== confirmPassword) {
                statusMsg.style.display = 'block';
                statusMsg.style.background = '#fee2e2';
                statusMsg.style.color = '#991b1b';
                statusMsg.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            const result = await window.authModule.updateUserPassword(newPassword);

            statusMsg.style.display = 'block';
            if (result.success) {
                statusMsg.style.background = '#dcfce7';
                statusMsg.style.color = '#166534';
                statusMsg.textContent = 'Password updated successfully! Redirecting to login...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                statusMsg.style.background = '#fee2e2';
                statusMsg.style.color = '#991b1b';
                statusMsg.textContent = result.error;
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
