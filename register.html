<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration | Gram Panchayat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Gram Panchayat Portal</h1>
            <p>Citizen Registration</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 500px; margin: 2rem auto;">
            <h2 style="color: var(--primary-dark); margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
            
            <div id="error-message" style="color: var(--danger); margin-bottom: 1rem; display: none; font-size: 0.9rem; text-align: center;"></div>
            <div id="success-message" style="color: var(--secondary-green); margin-bottom: 1rem; display: none; font-size: 0.9rem; text-align: center;"></div>

            <form id="register-form">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">

                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••••">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="10-digit mobile number">

                <label for="village">Village Name</label>
                <input type="text" id="village" required placeholder="e.g., Shahpur">

                <button type="submit" class="btn-primary" id="submit-btn">Register Account</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--primary-blue);">Login here</a>
            </p>
        </div>
    </div>

    <!-- Load Supabase CDN and custom JS modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-enhancements.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errDiv = document.getElementById('error-message');
            const succDiv = document.getElementById('success-message');
            
            errDiv.style.display = 'none';
            succDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Registering...';

            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const village = document.getElementById('village').value;

            const result = await window.authModule.registerUser(fullName, email, password, phone, village);

            if (result.success) {
                succDiv.textContent = 'Registration successful! Redirecting to login...';
                succDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                errDiv.textContent = result.error;
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Register Account';
            }
        });
    </script>
</body>
</html>
