<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login | Gram Panchayat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Gram Panchayat Portal</h1>
            <p>Citizen Portal Login</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 400px; margin: 3rem auto;">
            <h2 style="color: var(--primary-dark); margin-bottom: 1.5rem; text-align: center;">Citizen Sign In</h2>
            
            <div id="error-message" style="color: var(--danger); margin-bottom: 1rem; display: none; font-size: 0.9rem; text-align: center;"></div>

            <form id="login-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">

                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">

                <div style="text-align: right; margin-top: 0.4rem; margin-bottom: 1rem;">
                    <a href="#" id="forgot-password-link" style="font-size: 0.85rem; color: var(--primary-blue);">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary-blue);">Register here</a>
            </p>
        </div>
    </div>

    <!-- Load Supabase CDN and custom JS modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-enhancements.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errDiv = document.getElementById('error-message');
            
            errDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await window.authModule.loginUser(email, password);

            if (result.success) {
                // Route based on role
                if (result.profile.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'citizen-dashboard.html';
                }
            } else {
                errDiv.textContent = result.error;
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        document.getElementById('forgot-password-link').addEventListener('click', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const email = emailInput || prompt('Enter your registered email address to receive a password reset link:');
            if (!email) return;

            const result = await window.authModule.sendPasswordReset(email);
            if (result.success) {
                alert('Password reset link sent! Please check your email inbox.');
            } else {
                alert('Error: ' + result.error);
            }
        });
    </script>
</body>
</html>
